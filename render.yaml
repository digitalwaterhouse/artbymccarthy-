# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Create the service by pointing Render at this repo (New → Blueprint); it reads
# this file instead of you filling the service form by hand, and it attaches the
# persistent disk in the same step. That matters: on Render the disk is the only
# thing standing between a routine deploy and an empty gallery, and attaching it
# afterwards is how people lose the first week of uploads.
#
# See DEPLOY.md in this repo for the order of operations and the checks worth
# doing before the domain is pointed here.
services:
  - type: web
    name: artbymccarthy
    runtime: python
    # NOT free. The free tier's filesystem is ephemeral, so every deploy would
    # wipe data/ — the database, every uploaded painting photo, the orders and
    # the enquiries. A disk requires a paid instance; this is that instance.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # PORT is set by Render; app.py only reads it when run directly, gunicorn
    # takes it from this line.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    # /health is a real route in app.py. With APP_PREFIX at the root (below) it
    # answers at exactly this path.
    healthCheckPath: /health
    disk:
      name: data
      # gallery.py resolves the database and the photo directory relative to the
      # app root: <repo>/data/gallery.db and <repo>/data/photos. Render checks
      # the repo out at /opt/render/project/src, so this mount path puts the
      # disk exactly where the app already looks. Do not "tidy" it to /data —
      # the app would then write to the ephemeral filesystem and lose it.
      mountPath: /opt/render/project/src/data
      # 81 MB in use today, a few MB per painting. 1 GB is years of headroom and
      # the size can be raised later without a rebuild.
      sizeGB: 1
    envVars:
      # "/" not "" — app.py reads APP_PREFIX with a DEFAULT of /artbymccarthy,
      # so anything that drops an empty string (and some env systems do) would
      # silently remount the whole site under the old subpath on her own domain.
      # The app rstrips the slash, so "/" resolves to the root and cannot be
      # mistaken for unset.
      - key: APP_PREFIX
        value: "/"
      # It should be indexed here. NOINDEX=1 only existed because the site was
      # living under digitalwaterhouse.com, whose robots.txt is out of reach.
      - key: NOINDEX
        value: "0"
      # Generated by Render, never in the repo, and deliberately NOT the old
      # server's key — moving a session secret between hosts moves nothing
      # useful and spreads a secret that was fine where it was.
      - key: SECRET_KEY
        generateValue: true
      # Everything below is set by hand in the Render dashboard. sync:false means
      # the Blueprint declares that the variable exists without carrying a value
      # through git.
      - key: ADMIN_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_TAX
        value: "0"
      # THERE IS NO LOCAL MAIL SERVER ON RENDER. On p6 the app talked to postfix
      # on localhost:25 and that is why SMTP_HOST defaulted to localhost. Left
      # unset here, mailer.send() returns False and every enquiry and commission
      # request is accepted by the form and then quietly never arrives.
      # Resend over SMTP: host smtp.resend.com, port 587, user "resend",
      # password an API key, STARTTLS on.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_STARTTLS
        value: "1"
      # The From address must be on a domain the mail provider has verified,
      # which is her domain now rather than digitalwaterhouse.com.
      - key: MAIL_FROM
        sync: false
